name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write # required to create the GitHub Release and upload binary assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - runner: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - runner: macos-13
            target: x86_64-apple-darwin
            archive: tar.gz
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build release binary
        # `shell: bash` is mandatory: the Windows runner defaults to pwsh, where `$TARGET`
        # expands to nothing and `--target` would be passed an empty value.
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "$TARGET"
      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        # `shasum -a 256` is present on both the Ubuntu and the macOS runner;
        # `sha256sum` is not (macOS ships neither GNU coreutils nor that name).
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cd "target/$TARGET/release"
          tar -czf "../../../git-gone-$TARGET.tar.gz" git-gone
          cd ../../..
          shasum -a 256 "git-gone-$TARGET.tar.gz" > "git-gone-$TARGET.tar.gz.sha256"
      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          Compress-Archive -Path "target/$env:TARGET/release/git-gone.exe" `
            -DestinationPath "git-gone-$env:TARGET.zip"
          $asset = "git-gone-$env:TARGET.zip"
          $hash = (Get-FileHash -Algorithm SHA256 -Path $asset).Hash.ToLower()
          # Same "<hash>  <file>" layout as shasum, so both are verifiable the same way.
          "$hash  $asset" | Out-File -Encoding ascii -NoNewline "$asset.sha256"
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          # The `.sha256` files are what `scripts/install.sh` and `install.ps1` verify the
          # download against — a release without them makes the installers fail closed.
          files: |
            git-gone-${{ matrix.target }}.tar.gz
            git-gone-${{ matrix.target }}.tar.gz.sha256
            git-gone-${{ matrix.target }}.zip
            git-gone-${{ matrix.target }}.zip.sha256
          generate_release_notes: true
          fail_on_unmatched_files: false
