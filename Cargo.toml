[package]
# The crate name `git-gone` on crates.io is taken by an unrelated project; the
# binary keeps the `git-gone` name via [[bin]] so the `git gone` alias works.
name = "git-gone-multi"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
authors = ["Victor Razuvaev <rasuvaeff@gmail.com>"]
license = "MIT OR Apache-2.0"
description = "Delete local Git branches whose remote has been deleted — in one repo or across a whole tree of nested repos"
homepage = "https://github.com/rasuvaeff/git-gone"
repository = "https://github.com/rasuvaeff/git-gone"
documentation = "https://github.com/rasuvaeff/git-gone#readme"
readme = "README.md"
keywords = ["git", "branch", "cleanup", "cli", "gone"]
categories = ["command-line-utilities", "development-tools"]
# `.gitattributes` `export-ignore` only affects `git archive`; Cargo needs its own list.
exclude = [
    "/.github",
    "/.editorconfig",
    "/.gitattributes",
    "/.gitignore",
    "/AGENTS.md",
    "/CLAUDE.md",
    "/scripts",
    "/target",
    "/tests",
    "*.bak",
]

[[bin]]
name = "git-gone"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
